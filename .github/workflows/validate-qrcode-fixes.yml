name: Validate qrcode fixes
on:
  push:
    branches:
      - feat/qrcode-estoque
    paths:
      - .github/workflows/validate-qrcode-fixes.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/movimentacoes.js
      - run: node --check js/produtos.js
