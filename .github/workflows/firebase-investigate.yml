name: Firebase one-off investigation
on:
  push:
    branches:
      - feat/qrcode-estoque
    paths:
      - .github/workflows/firebase-investigate.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Firestore product and conversion
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='estoque-d3354'
          API_KEY="$(sed -n 's/.*apiKey: *"\([^"]*\)".*/\1/p' js/firebase-config.js | head -1)"

          AUTH_JSON="$(curl -sS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}')"
          TOKEN="$(echo "$AUTH_JSON" | jq -r '.idToken // empty')"
          if [ -z "$TOKEN" ]; then
            echo "AUTH_FAILED"
            echo "$AUTH_JSON" | jq '{error}'
            exit 1
          fi

          QUERY='{"structuredQuery":{"from":[{"collectionId":"produtos"}],"where":{"fieldFilter":{"field":{"fieldPath":"codigo"},"op":"EQUAL","value":{"stringValue":"TUB4509NAT"}}},"limit":10}}'
          RESULT="$(curl -sS -X POST "https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents:runQuery" -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' -d "$QUERY")"

          echo '=== PRODUCT_QUERY ==='
          echo "$RESULT" | jq '[.[] | select(.document) | {name:.document.name, fields:.document.fields}]'

          PRODUCT_ID="$(echo "$RESULT" | jq -r '[.[] | select(.document)][0].document.name // empty' | awk -F/ '{print $NF}')"
          CONV_ID="$(echo "$RESULT" | jq -r '[.[] | select(.document)][0].document.fields.conversaoId.stringValue // empty')"
          echo "PRODUCT_ID=${PRODUCT_ID}"
          echo "CONVERSAO_ID=${CONV_ID:-<empty>}"

          if [ -n "$CONV_ID" ]; then
            CONV="$(curl -sS "https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/conversoes/${CONV_ID}" -H "Authorization: Bearer ${TOKEN}")"
            echo '=== CONVERSION ==='
            echo "$CONV" | jq '{name, fields}'
          else
            echo '=== CONVERSION ==='
            echo 'No conversionId on product.'
          fi

          if [ -n "$PRODUCT_ID" ]; then
            MOVQ="$(jq -nc --arg pid "$PRODUCT_ID" '{structuredQuery:{from:[{collectionId:"movimentacoes"}],where:{fieldFilter:{field:{fieldPath:"productId"},op:"EQUAL",value:{stringValue:$pid}}},limit:200}}')"
            MOVS="$(curl -sS -X POST "https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents:runQuery" -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' -d "$MOVQ")"
            echo '=== MOVEMENTS_60_94 ==='
            echo "$MOVS" | jq '[.[] | select(.document) | {name:.document.name, fields:.document.fields} | select((.fields.quantidade.integerValue=="94") or (.fields.quantidade.doubleValue==94) or (.fields.quantidade_compra.integerValue=="60") or (.fields.quantidade_compra.doubleValue==60))]'
          fi
