name: Firebase backend correction
on:
  push:
    branches:
      - feat/qrcode-estoque
    paths:
      - .github/workflows/firebase-backend-fix.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase@12
      - run: node .github/firebase-backend-fix.mjs
