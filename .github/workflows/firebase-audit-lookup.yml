name: Firebase audit lookup
on:
  push:
    branches:
      - feat/qrcode-estoque
    paths:
      - .github/workflows/firebase-audit-lookup.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase@12
      - run: node .github/firebase-audit.mjs
