<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Consultas - Controle de Estoque</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="flex h-screen">
<aside class="w-64 bg-gray-800 text-white flex flex-col">
    <div class="p-6 text-2xl font-bold border-b border-gray-700">
        Estoque
    </div>
    <nav class="flex-1 p-4 space-y-2">
        <a href="index.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">dashboard</span>
            Dashboard
        </a>
        <a href="configuracoes.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">settings</span>
            Configurações
        </a>
        <a href="produtos.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">inventory_2</span>
            Produtos
        </a>
        <a href="movimentacoes.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">sync_alt</span>
            Movimentações
        </a>
        <a href="obras.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">construction</span>
            Obras
        </a>
        <a href="consultas.html" class="flex items-center px-4 py-2 text-white bg-blue-500 rounded-md">
            <span class="material-icons mr-3">search</span>
            Consultas
        </a>
        <a href="reservas.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">book_online</span>
            Reservas
        </a>
        <a href="implementacao.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">build</span>
            Implementação
        </a>
    </nav>
</aside>
<main class="flex-1 p-8 overflow-y-auto">
    <header>
        <h1 class="text-3xl font-bold text-gray-800">Consulta de Estoque</h1>
    </header>
    <section class="content mt-8">
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="text" id="filter-codigo" class="form-input" placeholder="Filtrar por Código...">
                <input type="text" id="filter-descricao" class="form-input" placeholder="Filtrar por Descrição...">
                <input type="text" id="filter-local" class="form-input" placeholder="Filtrar por Local...">
            </div>
            <div class="overflow-x-auto">
                <table id="table-consultas" class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Código</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descrição</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cor</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estoque Atual</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Reservado</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">UN</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Custo Un. Médio</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Custo Total Estoque</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Locação</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <!-- Data will be loaded here by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/consultas.js"></script>
</body>
</html>
