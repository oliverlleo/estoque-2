<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas - Controle de Estoque</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-archive"></i> Estoque</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"><i class="fas fa-th-large"></i>Dashboard</a></li>
                <li><a href="configuracoes.html"><i class="fas fa-cog"></i>Configurações</a></li>
                <li><a href="produtos.html"><i class="fas fa-box"></i>Produtos</a></li>
                <li><a href="movimentacoes.html"><i class="fas fa-exchange-alt"></i>Movimentações</a></li>
                <li><a href="obras.html"><i class="fas fa-briefcase"></i>Obras</a></li>
                <li><a href="consultas.html" class="active"><i class="fas fa-search"></i>Consultas</a></li>
                <li><a href="reservas.html"><i class="fas fa-clipboard-list"></i>Reservas</a></li>
                <li><a href="implementacao.html"><i class="fas fa-wrench"></i>Implementação</a></li>
            </ul>
        </nav>
    </aside>
    <main class="main-content">
        <header>
            <h1>Consulta de Estoque</h1>
        </header>
        <section class="content">
            <div class="card">
                <div class="card-header"><h3>Consulta de Estoque e Valores</h3></div>
                <div class="card-body">
                    <div class="filters-container" style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <input type="text" id="filter-codigo" class="form-control" placeholder="Filtrar por Código...">
                        <input type="text" id="filter-descricao" class="form-control" placeholder="Filtrar por Descrição...">
                        <input type="text" id="filter-local" class="form-control" placeholder="Filtrar por Local...">
                    </div>
                    <div class="table-wrapper">
                        <table id="table-consultas" class="table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Descrição</th>
                                    <th>Cor</th>
                                    <th>Estoque Atual</th>
                                    <th>Reservado</th>
                                    <th>UN</th>
                                    <th>Custo Un. Médio</th>
                                    <th>Custo Total Estoque</th>
                                    <th>Locação</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Data will be loaded here by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/consultas.js"></script>
</body>
</html>
