<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Configurações - Controle de Estoque</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="flex h-screen">
<aside class="w-64 bg-gray-800 text-white flex flex-col">
    <div class="p-6 text-2xl font-bold border-b border-gray-700">
        Estoque
    </div>
    <nav class="flex-1 p-4 space-y-2">
        <a href="index.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">dashboard</span>
            Dashboard
        </a>
        <a href="configuracoes.html" class="flex items-center px-4 py-2 text-white bg-blue-500 rounded-md">
            <span class="material-icons mr-3">settings</span>
            Configurações
        </a>
        <a href="produtos.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">inventory_2</span>
            Produtos
        </a>
        <a href="movimentacoes.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">sync_alt</span>
            Movimentações
        </a>
        <a href="obras.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">construction</span>
            Obras
        </a>
        <a href="consultas.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">search</span>
            Consultas
        </a>
        <a href="reservas.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">book_online</span>
            Reservas
        </a>
        <a href="implementacao.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">build</span>
            Implementação
        </a>
    </nav>
</aside>
<main class="flex-1 p-8">
    <header class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Configurações</h1>
        <p class="text-gray-500 mt-1">Gerencie as configurações gerais do seu sistema de estoque.</p>
    </header>
    <div id="config-buttons-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Buttons are dynamically generated by js/configuracoes.js -->
    </div>
    <div id="config-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center pb-3 border-b">
                <h3 id="modal-title" class="text-2xl font-bold"></h3>
                <div class="cursor-pointer z-50 close-button">
                    <span class="text-black h-6 w-6 text-2xl block outline-none focus:outline-none">×</span>
                </div>
            </div>
            <div id="modal-body" class="mt-3"></div>
        </div>
    </div>
</main>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/configuracoes.js"></script>
</body>
</html>
