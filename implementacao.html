<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Implementação - Controle de Estoque</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="flex h-screen">
<aside class="w-64 bg-gray-800 text-white flex flex-col">
    <div class="p-6 text-2xl font-bold border-b border-gray-700">
        Estoque
    </div>
    <nav class="flex-1 p-4 space-y-2">
        <a href="index.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">dashboard</span>
            Dashboard
        </a>
        <a href="configuracoes.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">settings</span>
            Configurações
        </a>
        <a href="produtos.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">inventory_2</span>
            Produtos
        </a>
        <a href="movimentacoes.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">sync_alt</span>
            Movimentações
        </a>
        <a href="obras.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">construction</span>
            Obras
        </a>
        <a href="consultas.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">search</span>
            Consultas
        </a>
        <a href="reservas.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
            <span class="material-icons mr-3">book_online</span>
            Reservas
        </a>
        <a href="implementacao.html" class="flex items-center px-4 py-2 text-white bg-blue-500 rounded-md">
            <span class="material-icons mr-3">build</span>
            Implementação
        </a>
    </nav>
</aside>
<main class="flex-1 p-8 overflow-y-auto">
    <header>
        <h1 class="text-3xl font-bold text-gray-800">Implementação de Estoque</h1>
    </header>
    <section class="content mt-8">
        <div class="bg-white p-6 rounded-lg shadow-md">
             <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="start-address" class="block text-sm font-medium text-gray-700">Endereçamento Inicial</label>
                    <input type="text" id="start-address" class="form-input mt-1" placeholder="Ex: 01-A-01-A">
                </div>
                <div>
                    <label for="end-address" class="block text-sm font-medium text-gray-700">Endereçamento Final</label>
                    <input type="text" id="end-address" class="form-input mt-1" placeholder="Ex: 10-C-20-B">
                </div>
                <div class="md:col-span-2 flex justify-end">
                    <button id="btn-list-items" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Listar Itens</button>
                </div>
            </div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-md mt-8">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Itens para Implementação</h3>
                <div class="flex items-center space-x-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="filter-no-quantity" class="form-checkbox">
                        <span class="ml-2">Sem Quantidade</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" id="filter-no-value" class="form-checkbox">
                        <span class="ml-2">Sem Valor</span>
                    </label>
                    <button id="btn-confirm-movement" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">Confirmar Movimentação</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table id="table-implementacao" class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Código</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descrição</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Endereço</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quantidade</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Valor Unit.</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ICMS</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IPI</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Frete</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/implementacao.js"></script>
</body>
</html>
