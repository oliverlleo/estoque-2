<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementação - Controle de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i data-feather="archive"></i> Estoque</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"><i data-feather="home"></i>Dashboard</a></li>
                <li><a href="configuracoes.html"><i data-feather="settings"></i>Configurações</a></li>
                <li><a href="produtos.html"><i data-feather="box"></i>Produtos</a></li>
                <li><a href="movimentacoes.html"><i data-feather="git-commit"></i>Movimentações</a></li>
                <li><a href="obras.html"><i data-feather="briefcase"></i>Obras</a></li>
                <li><a href="consultas.html"><i data-feather="search"></i>Consultas</a></li>
                <li><a href="reservas.html"><i data-feather="clipboard"></i>Reservas</a></li>
                <li><a href="implementacao.html" class="active"><i data-feather="chevrons-down"></i>Implementação</a></li>
            </ul>
        </nav>
    </aside>
    <main class="main-content">
        <header>
            <h1>Implementação de Estoque</h1>
        </header>
        <section class="content">
            <div class="card">
                <div class="card-header">
                    <h3>Filtrar por Endereçamento</h3>
                </div>
                <div class="card-body">
                    <div class="filters-container" style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                        <div style="flex-grow: 1;">
                            <label for="start-address">Endereçamento Inicial</label>
                            <input type="text" id="start-address" class="form-control" placeholder="Ex: 01-A-01-A">
                        </div>
                        <div style="flex-grow: 1;">
                            <label for="end-address">Endereçamento Final</label>
                            <input type="text" id="end-address" class="form-control" placeholder="Ex: 10-C-20-B">
                        </div>
                        <button id="btn-list-items" class="btn">Listar Itens</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>Itens para Implementação</h3>
                        <div class="filters-container" style="display: flex; gap: 15px; align-items: center;">
                            <label><input type="checkbox" id="filter-no-quantity"> Sem Quantidade</label>
                            <label><input type="checkbox" id="filter-no-value"> Sem Valor</label>
                            <button id="btn-confirm-movement" class="btn btn-success">Confirmar Movimentação</button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-wrapper">
                        <table id="table-implementacao" class="table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Descrição</th>
                                    <th>Endereço</th>
                                    <th style="width: 100px;">Quantidade</th>
                                    <th style="width: 120px;">Valor Unit.</th>
                                    <th style="width: 100px;">ICMS</th>
                                    <th style="width: 100px;">IPI</th>
                                    <th style="width: 100px;">Frete</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Rows will be populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/implementacao.js"></script>
    <script> feather.replace() </script>
</body>
</html>
