<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Obra</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
         /* Toggle Switch similar to Movimentações */
        .toggle-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            user-select: none;
            padding: 10px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #dc3545; /* Red for Saída/Separados */
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #0d6efd; /* Blue for Reserva/Pendentes */
        }
        input:checked + .slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="loader" class="fixed inset-0 bg-white flex flex-col justify-center items-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-gray-600">Buscando obra...</p>
    </div>

    <div id="error-screen" class="hidden fixed inset-0 bg-white flex flex-col justify-center items-center z-40 p-6 text-center">
        <span class="material-icons text-red-500 text-6xl mb-4">error_outline</span>
        <h2 class="text-xl font-bold mb-2">Obra não encontrada</h2>
        <p class="text-gray-500 mb-6">O código escaneado não corresponde a nenhuma obra registrada.</p>
        <a href="index.html" class="bg-blue-500 text-white px-6 py-2 rounded-lg font-medium">Voltar ao Início</a>
    </div>

    <div id="content" class="hidden pb-20">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-30" id="header-obra">
            <div class="flex justify-between items-start">
                <div>
                     <h1 class="text-2xl font-bold" id="obra-nome">...</h1>
                     <p class="text-blue-100 text-sm mt-1" id="obra-client">...</p>
                </div>
            </div>
        </header>

         <!-- Toggle Switch -->
         <div class="bg-white p-2 shadow-sm flex justify-center sticky top-[72px] z-20">
            <div class="toggle-container">
                <span id="toggle-label-separados" style="font-weight: bold; color: #dc3545;">Separados</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="mode-toggle">
                    <span class="slider"></span>
                </label>
                <span id="toggle-label-pendentes" style="font-weight: normal; color: #6c757d;">Pendentes</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 gap-4 p-4">
            <div class="bg-white p-3 rounded-lg shadow text-center border-l-4 border-blue-500">
                <span class="block text-gray-500 text-xs uppercase font-bold">Total Itens</span>
                <span class="text-2xl font-bold text-gray-800" id="total-items">0</span>
            </div>
        </div>

        <!-- Filter -->
        <div class="px-4 mb-2">
            <input type="text" id="search-input" placeholder="Buscar produto..." class="w-full p-3 rounded-lg border border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- List -->
        <div id="items-list" class="px-4 space-y-3">
            <!-- Items injected here -->
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="product-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" id="product-modal-backdrop"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="relative inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="product-modal-title">
                                Produto
                            </h3>
                            <div class="mt-4">
                                <div class="w-full h-64 bg-gray-100 rounded-lg flex items-center justify-center mb-4 overflow-hidden border border-gray-200">
                                    <img id="product-modal-image" src="" alt="Imagem do Produto" class="w-full h-full object-contain hidden">
                                    <span id="product-modal-placeholder" class="text-gray-400">Sem imagem</span>
                                </div>
                                <div class="text-sm text-gray-500 text-left p-2 bg-gray-50 rounded" id="product-modal-description">
                                    <!-- Descrição Detalhada -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="product-modal-close" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Fechar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        let allItems = {
            separados: [], // tipo: 'saida'
            pendentes: []  // tipo: 'reserva'
        };
        let currentMode = 'separados'; // or 'pendentes'
        let productsMap = new Map(); // Store product details

        // Elements
        const headerObra = document.getElementById('header-obra');
        const productModal = document.getElementById('product-modal');
        const productModalBackdrop = document.getElementById('product-modal-backdrop');
        const productModalClose = document.getElementById('product-modal-close');
        const toggleInput = document.getElementById('mode-toggle');
        const labelSeparados = document.getElementById('toggle-label-separados');
        const labelPendentes = document.getElementById('toggle-label-pendentes');

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const obraId = params.get('id');

            if (!obraId) {
                showError('Nenhuma obra especificada.');
                return;
            }

            try {
                // 1. Fetch Obra Details
                const obraDocRef = doc(db, 'obras', obraId);
                const obraDoc = await getDoc(obraDocRef);

                if (!obraDoc.exists()) {
                    showError('Obra não encontrada.');
                    return;
                }
                const obraData = obraDoc.data();
                document.getElementById('obra-nome').textContent = obraData.nome;
                document.getElementById('obra-client').textContent = obraData.cliente || '';

                // 2. Fetch Movements for this Obra
                // We need to fetch movements to identify products
                const q = query(collection(db, 'movimentacoes'), where("obraId", "==", obraId));
                const querySnapshot = await getDocs(q);

                const movimentos = [];
                const productIds = new Set();

                querySnapshot.forEach(doc => {
                    const mov = doc.data();
                    movimentos.push(mov);
                    if (mov.produtoId) productIds.add(mov.produtoId);
                });

                // 3. Fetch Products Details
                // In a large system, we might want to batch this, but for now we fetch all relevant products.
                // Or better, fetch all products once if the set is small enough, but let's do it right.
                // Given "so faz o brach direto" and existing patterns, I'll fetch all products to be safe and simple.
                const productsSnapshot = await getDocs(query(collection(db, 'produtos'), where("arquivado", "!=", true)));
                productsSnapshot.forEach(doc => {
                    productsMap.set(doc.id, { id: doc.id, ...doc.data() });
                });


                // 4. Process Data into Separados and Pendentes
                // Aggregate quantities by product
                const aggregation = {
                    separados: {},
                    pendentes: {}
                };

                movimentos.forEach(mov => {
                    if (mov.tipo === 'saida') {
                        if (!aggregation.separados[mov.produtoId]) aggregation.separados[mov.produtoId] = 0;
                        aggregation.separados[mov.produtoId] += (mov.quantidade || 0);
                    } else if (mov.tipo === 'reserva') {
                         if (!aggregation.pendentes[mov.produtoId]) aggregation.pendentes[mov.produtoId] = 0;
                        aggregation.pendentes[mov.produtoId] += (mov.quantidade || 0);
                    }
                });

                // Convert to array
                allItems.separados = Object.keys(aggregation.separados).map(pid => {
                    const prod = productsMap.get(pid);
                    if (!prod) return null;
                    return {
                        ...prod,
                        quantidade: aggregation.separados[pid]
                    };
                }).filter(i => i !== null);

                allItems.pendentes = Object.keys(aggregation.pendentes).map(pid => {
                     const prod = productsMap.get(pid);
                    if (!prod) return null;
                    return {
                        ...prod,
                        quantidade: aggregation.pendentes[pid]
                    };
                }).filter(i => i !== null);

                // Initial Render
                updateToggleUI();
                renderCurrentList();

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                // Init Search
                document.getElementById('search-input').addEventListener('input', (e) => {
                    renderCurrentList(e.target.value);
                });

                // Init Toggle
                toggleInput.addEventListener('change', () => {
                    currentMode = toggleInput.checked ? 'pendentes' : 'separados';
                    updateToggleUI();
                    renderCurrentList(document.getElementById('search-input').value);
                });

                 // Modal Close Listeners
                const closeProductModal = () => productModal.classList.add('hidden');
                productModalClose.addEventListener('click', closeProductModal);
                productModalBackdrop.addEventListener('click', closeProductModal);

            } catch (e) {
                console.error(e);
                showError('Erro ao carregar dados: ' + e.message);
            }
        });

        function updateToggleUI() {
            if (currentMode === 'separados') {
                labelSeparados.style.color = '#dc3545';
                labelSeparados.style.fontWeight = 'bold';
                labelPendentes.style.color = '#6c757d';
                labelPendentes.style.fontWeight = 'normal';
            } else {
                labelSeparados.style.color = '#6c757d';
                labelSeparados.style.fontWeight = 'normal';
                labelPendentes.style.color = '#0d6efd';
                labelPendentes.style.fontWeight = 'bold';
            }
        }

        function showError(msg) {
            if(msg) document.querySelector('#error-screen p').textContent = msg;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('error-screen').classList.remove('hidden');
        }

        function renderCurrentList(searchTerm = '') {
            const list = allItems[currentMode];
            const term = searchTerm.toLowerCase();

            const filtered = list.filter(i =>
                (i.codigo || '').toLowerCase().includes(term) ||
                (i.descricao || '').toLowerCase().includes(term)
            );

            document.getElementById('total-items').textContent = filtered.length;
            const container = document.getElementById('items-list');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-10">Nenhum item encontrado.</div>';
                return;
            }

            filtered.forEach(item => {
                const el = document.createElement('div');
                el.className = 'bg-white rounded-lg shadow p-4 flex flex-col gap-2 border border-gray-100 cursor-pointer hover:shadow-lg transition-shadow';
                el.onclick = () => openProductModal(item);

                const colorClass = currentMode === 'separados' ? 'text-red-600' : 'text-blue-600';

                // Card Layout
                el.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="bg-gray-200 text-gray-800 text-xs font-bold px-2 py-1 rounded">${item.codigo}</span>
                        <span class="text-xs text-gray-500">${item.un}</span>
                    </div>
                    <h3 class="font-bold text-gray-800 text-lg leading-tight">${item.descricao}</h3>
                    <div class="flex justify-between items-end mt-2">
                        <div>
                            <span class="text-xs text-gray-500 block">Cor</span>
                            <span class="font-medium">${item.cor || '-'}</span>
                        </div>
                        <div class="flex gap-4 text-right">
                             <div>
                                <span class="block text-xs text-gray-500">Quantidade</span>
                                <span class="text-2xl font-bold ${colorClass}">${item.quantidade}</span>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(el);
            });
        }

        function openProductModal(item) {
            document.getElementById('product-modal-title').textContent = `${item.codigo} - ${item.descricao}`;
            const imgEl = document.getElementById('product-modal-image');
            const placeholderEl = document.getElementById('product-modal-placeholder');
            const descEl = document.getElementById('product-modal-description');

            if (item.imagem) {
                imgEl.src = item.imagem;
                imgEl.classList.remove('hidden');
                placeholderEl.classList.add('hidden');
            } else {
                imgEl.src = '';
                imgEl.classList.add('hidden');
                placeholderEl.classList.remove('hidden');
            }

            descEl.innerHTML = item.descricao_detalhada ? item.descricao_detalhada.replace(/\n/g, '<br>') : 'Sem descrição detalhada.';
            productModal.classList.remove('hidden');
        }
    </script>
</body>
</html>
