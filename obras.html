<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Custos por Obra - Controle de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .obras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .obra-card {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .obra-card h4 {
            margin-top: 0;
        }
        .obra-card .custo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
            margin: 10px 0;
        }
        .obra-card .ver-mais {
            margin-top: auto;
            align-self: flex-end;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Estoque</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a class="flex items-center px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 rounded-md" href="index.html">
                <span class="material-icons mr-3">dashboard</span>
                Dashboard
            </a>
            <a class="flex items-center px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 rounded-md" href="produtos.html">
                <span class="material-icons mr-3">inventory_2</span>
                Produtos
            </a>
            <a class="flex items-center px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 rounded-md" href="movimentacoes.html">
                <span class="material-icons mr-3">sync_alt</span>
                Movimentações
            </a>
            <a class="flex items-center px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md" href="obras.html">
                <span class="material-icons mr-3">construction</span>
                Obras
            </a>
            <a class="flex items-center px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 rounded-md" href="reservas.html">
                <span class="material-icons mr-3">book_online</span>
                Reservas
            </a>
            <a class="flex items-center px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 rounded-md" href="consultas.html">
                <span class="material-icons mr-3">search</span>
                Consultas
            </a>
            <a class="flex items-center px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 rounded-md" href="#">
                <span class="material-icons mr-3">assessment</span>
                Relatórios
            </a>
            <a class="flex items-center px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 rounded-md" href="configuracoes.html">
                <span class="material-icons mr-3">settings</span>
                Configurações
            </a>
            <a class="flex items-center px-4 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 rounded-md" href="implementacao.html">
                <span class="material-icons mr-3">help_outline</span>
                Ajuda/Implantação
            </a>
        </nav>
    </aside>
    <main class="main-content">
        <header>
            <h1>Análise de Custos por Obra</h1>
        </header>
        <section class="content">
            <div class="card">
                <div class="card-body">
                    <div class="filters-container" style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <input type="text" id="filter-codigo" class="form-control" placeholder="Filtrar por Código...">
                        <input type="text" id="filter-obra" class="form-control" placeholder="Filtrar por Obra...">
                    </div>
                    <div id="obras-container" class="obras-grid">
                        <!-- Obra cards will be loaded here by JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/obras.js"></script>
</body>
</html>
