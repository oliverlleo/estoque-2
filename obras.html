<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Custos por Obra - Controle de Estoque</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .obras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .obra-card {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .obra-card h4 {
            margin-top: 0;
        }
        .obra-card .custo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
            margin: 10px 0;
        }
        .obra-card .ver-mais {
            margin-top: auto;
            align-self: flex-end;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-archive"></i> Estoque</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"><i class="fas fa-th-large"></i>Dashboard</a></li>
                <li><a href="configuracoes.html"><i class="fas fa-cog"></i>Configurações</a></li>
                <li><a href="produtos.html"><i class="fas fa-box"></i>Produtos</a></li>
                <li><a href="movimentacoes.html"><i class="fas fa-exchange-alt"></i>Movimentações</a></li>
                <li><a href="obras.html" class="active"><i class="fas fa-briefcase"></i>Obras</a></li>
                <li><a href="consultas.html"><i class="fas fa-search"></i>Consultas</a></li>
                <li><a href="reservas.html"><i class="fas fa-clipboard-list"></i>Reservas</a></li>
                <li><a href="implementacao.html"><i class="fas fa-wrench"></i>Implementação</a></li>
            </ul>
        </nav>
    </aside>
    <main class="main-content">
        <header>
            <h1>Análise de Custos por Obra</h1>
        </header>
        <section class="content">
            <div class="card">
                <div class="card-body">
                    <div class="filters-container" style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <input type="text" id="filter-codigo" class="form-control" placeholder="Filtrar por Código...">
                        <input type="text" id="filter-obra" class="form-control" placeholder="Filtrar por Obra...">
                    </div>
                    <div id="obras-container" class="obras-grid">
                        <!-- Obra cards will be loaded here by JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/obras.js"></script>
</body>
</html>
