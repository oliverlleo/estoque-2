<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Obra - Controle de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i data-feather="archive"></i> Estoque</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"><i data-feather="grid"></i>Dashboard</a></li>
                <li><a href="configuracoes.html"><i data-feather="settings"></i>Configurações</a></li>
                <li><a href="produtos.html"><i data-feather="archive"></i>Produtos</a></li>
                <li><a href="movimentacoes.html"><i data-feather="repeat"></i>Movimentações</a></li>
                <li><a href="obras.html" class="active"><i data-feather="tool"></i>Obras</a></li>
                <li><a href="consultas.html"><i data-feather="search"></i>Consultas</a></li>
                <li><a href="reservas.html"><i data-feather="calendar"></i>Reservas</a></li>
            </ul>
        </nav>
    </aside>
    <main class="main-content">
        <header>
            <h1 id="obra-titulo">Carregando...</h1>
            <h3 id="obra-custo-total"></h3>
        </header>
        <section class="content">
            <div class="card">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>Itens Utilizados na Obra</h3>
                    <button id="btn-export-excel" class="btn" style="background-color: #198754;">Exportar para Excel</button>
                </div>
                <div class="card-body">
                    <div class="filters-container" style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <input type="text" id="filter-codigo-produto" class="form-control" placeholder="Filtrar por Código do Produto...">
                        <input type="text" id="filter-descricao-produto" class="form-control" placeholder="Filtrar por Descrição...">
                    </div>
                    <div class="table-wrapper">
                        <table id="table-itens-obra" class="table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Descrição</th>
                                    <th>UN</th>
                                    <th>Cor</th>
                                    <th>Fornecedor</th>
                                    <th>Grupo</th>
                                    <th>Aplicações</th>
                                    <th>Qtde</th>
                                    <th>Observação</th>
                                    <th>Valor Médio</th>
                                    <th>Valor Total</th>
                                </tr>
                            </thead>
                            <tbody id="detalhe-obra-table-body">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/detalhe-obra.js"></script>
    <script> feather.replace() </script>
</body>
</html>
