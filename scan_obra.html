<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Obra</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
         /* Toggle Switch (cloned from style.css/movimentacoes logic usually) */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            margin: 0 10px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #198754; /* Green for Separados/Itens by default */
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #dc3545; /* Red for Pendente/Reservas */
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
    <link rel="stylesheet" href="css/responsive-surgical.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="loader" class="fixed inset-0 bg-white flex flex-col justify-center items-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-gray-600">Buscando obra...</p>
    </div>

    <div id="error-screen" class="hidden fixed inset-0 bg-white flex flex-col justify-center items-center z-40 p-6 text-center">
        <span class="material-icons text-red-500 text-6xl mb-4">error_outline</span>
        <h2 class="text-xl font-bold mb-2">Obra não encontrada</h2>
        <p class="text-gray-500 mb-6">O código escaneado não corresponde a nenhuma obra registrada.</p>
        <a href="index.html" class="bg-blue-500 text-white px-6 py-2 rounded-lg font-medium">Voltar ao Início</a>
    </div>

    <div id="content" class="hidden pb-20">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-30" id="header-obra">
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-2">
                         <h1 class="text-xl font-bold" id="obra-nome">...</h1>
                    </div>
                    <p class="text-blue-100 text-sm mt-1" id="obra-codigo">...</p>
                </div>
            </div>
             <!-- Toggle Switch in Header Area -->
             <div class="mt-4 flex justify-center bg-blue-700 p-2 rounded-lg">
                <div class="toggle-container mb-0">
                    <span id="toggle-label-separados" class="text-white font-bold cursor-pointer opacity-100">Separados</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="view-toggle">
                        <span class="slider"></span>
                    </label>
                    <span id="toggle-label-pendentes" class="text-white font-normal cursor-pointer opacity-60">Pendentes</span>
                </div>
            </div>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 gap-4 p-4">
            <div class="bg-white p-3 rounded-lg shadow text-center border-l-4 border-blue-500">
                <span class="block text-gray-500 text-xs uppercase font-bold">Total Itens</span>
                <span class="text-2xl font-bold text-gray-800" id="total-items">0</span>
            </div>
        </div>

        <!-- Filter -->
        <div class="px-4 mb-2 flex flex-col md:flex-row gap-2">
            <input type="text" id="search-input" placeholder="Buscar produto..." class="w-full md:w-2/3 p-3 rounded-lg border border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <select id="filter-group" class="w-full md:w-1/3 p-3 rounded-lg border border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                <option value="">Todas as Categorias</option>
            </select>
        </div>

        <!-- List -->
        <div id="items-list" class="px-4 space-y-3">
            <!-- Items injected here -->
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="product-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" id="product-modal-backdrop"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="relative inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="product-modal-title">
                                Produto
                            </h3>
                            <div class="mt-4">
                                <div class="w-full h-64 bg-gray-100 rounded-lg flex items-center justify-center mb-4 overflow-hidden border border-gray-200">
                                    <img id="product-modal-image" src="" alt="Imagem do Produto" class="w-full h-full object-contain hidden">
                                    <span id="product-modal-placeholder" class="text-gray-400">Sem imagem</span>
                                </div>
                                <div class="text-sm text-gray-500 text-left p-2 bg-gray-50 rounded" id="product-modal-description">
                                    <!-- Descrição Detalhada -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="product-modal-close" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Fechar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/scan_obra.js"></script>
</body>
</html>
