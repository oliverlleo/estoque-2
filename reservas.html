<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Controle de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="flex h-screen">
    <aside class="w-64 bg-gray-800 text-white flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-gray-700">
            Estoque
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <span class="material-icons mr-3">dashboard</span>
                Dashboard
            </a>
            <a href="configuracoes.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <span class="material-icons mr-3">settings</span>
                Configurações
            </a>
            <a href="produtos.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <span class="material-icons mr-3">inventory_2</span>
                Produtos
            </a>
            <a href="movimentacoes.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <span class="material-icons mr-3">sync_alt</span>
                Movimentações
            </a>
            <a href="obras.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <span class="material-icons mr-3">construction</span>
                Obras
            </a>
            <a href="consultas.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <span class="material-icons mr-3">search</span>
                Consultas
            </a>
            <a href="reservas.html" class="flex items-center px-4 py-2 text-white bg-blue-500 rounded-md">
                <span class="material-icons mr-3">book_online</span>
                Reservas
            </a>
            <a href="inventario.html" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <span class="material-icons mr-3">build</span>
                Inventario
            </a>
        </nav>
    </aside>
    <main class="main-content flex-1 overflow-y-auto">
        <header>
            <h1>Reservas de Estoque</h1>
        </header>
        <section class="content">
            <div class="card">
                <div class="card-header"><h3>Gerenciamento de Reservas</h3></div>
                <div class="card-body">
                    <div class="filters-container" id="filters-container">
                        <input type="text" id="filter-codigo" class="form-control" placeholder="Filtrar por Código...">
                        <input type="text" id="filter-descricao" class="form-control" placeholder="Filtrar por Descrição...">
                        <input type="text" id="filter-obra" class="form-control" placeholder="Filtrar por Obra...">
                    </div>
                    <div class="table-wrapper">
                        <table id="table-reservas" class="table">
                            <thead>
                                <tr>
                                    <th>Status</th>
                                    <th>Data</th>
                                    <th>Código</th>
                                    <th>Descrição</th>
                                    <th>UN</th>
                                    <th>Cor</th>
                                    <th>Qtde</th>
                                    <th>Qtde em Estoque</th>
                                    <th>Obra</th>
                                    <th>Observação</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Data will be loaded here by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/reservas.js"></script>
    <script> feather.replace() </script>
</body>
</html>
