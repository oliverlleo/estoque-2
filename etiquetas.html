<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas para Impressão</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        /* ESTILOS GERAIS E DE CONTROLE */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .controls {
            position: fixed; top: 10px; left: 10px; z-index: 100;
            background-color: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .controls button { font-size: 16px; padding: 10px 20px; cursor: pointer; border: 1px solid #ccc; background-color: #f0f0f0; }
        .controls button.active { background-color: #007bff; color: white; border-color: #007bff; }
        .format-options { margin-top: 10px; }

        /* ESTRUTURA RÍGIDA DA ETIQUETA */
        .etiqueta-50x100 {
            background-color: white;
            width: 100mm;
            height: 50mm;
            padding: 4mm;
            box-sizing: border-box;
            border: 1px dashed #ccc;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Garante que nada vaze para fora */
        }
        .etiqueta-main {
            display: flex;
            gap: 3mm;
            flex: 1; /* Ocupa todo o espaço vertical disponível */
            min-height: 0;
        }
        .qr-code {
            width: 38mm;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .produto-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Classes de conteúdo específicas */
        .descricao-produto {
            font-size: 12pt;
            font-weight: bold;
            line-height: 1.2;
            text-transform: uppercase;
            margin-bottom: 1mm;
            overflow: hidden;
        }

        .detalhe-produto {
             font-size: 10pt;
             line-height: 1.2;
             text-transform: uppercase;
        }

        .codigo-container {
            margin-top: auto; /* Empurra para o final do espaço disponível */
            padding-top: 1mm;
        }

        .codigo-produto {
            font-size: 14pt;
            font-weight: bold;
            white-space: nowrap;
            background-color: #333 !important;
            color: white !important;
            text-align: center;
            padding: 4px 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .etiqueta-footer {
            text-align: center;
            font-weight: bold;
            font-size: 14pt;
            border-top: 3px solid black;
            padding-top: 1.5mm;
            margin-top: 2mm; /* Espaçamento entre o corpo e o rodapé */
            flex-shrink: 0;
        }

        /* ESTILOS DE IMPRESSÃO */
        .etiqueta-50x25-container {
            width: 106mm;
            height: 25mm;
            position: relative;
            display: block;
            border: 1px dashed #ccc;
            margin: 20px auto;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Cada etiqueta fica presa fisicamente dentro da folha 106x25.
           Nenhum conteúdo participa do fluxo vertical da página. */
        .etiqueta-50x25 {
            position: absolute;
            top: 0;
            width: 50mm;
            height: 25mm;
            box-sizing: border-box;
            padding: 1.2mm;
            overflow: hidden;
        }

        .etiqueta-50x25.etiqueta-left { left: 0.5mm; }
        .etiqueta-50x25.etiqueta-right { left: 55.5mm; }

        .etiqueta-50x25 .etiqueta-main {
            width: 100%;
            height: 22.6mm;
            max-height: 22.6mm;
            display: flex;
            align-items: flex-start;
            gap: 0.8mm;
            overflow: hidden;
            min-height: 0;
        }

        .etiqueta-50x25 .qr-code {
            width: 19mm;
            height: 19mm;
            flex: 0 0 19mm;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.6mm 0 0 0;
            overflow: hidden;
        }
        .etiqueta-50x25 .qr-code img,
        .etiqueta-50x25 .qr-code canvas {
            width: 19mm !important;
            height: 19mm !important;
            max-width: 19mm !important;
            max-height: 19mm !important;
            display: block;
        }

        .etiqueta-50x25 .produto-info {
            text-align: left;
            flex: 1 1 auto;
            min-width: 0;
            height: 22.6mm;
            max-height: 22.6mm;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .etiqueta-50x25 .descricao-produto {
            font-size: 7pt;
            line-height: 1.05;
            font-weight: bold;
            margin: 0 0 0.35mm 0;
            white-space: normal;
            max-height: 7.4mm;
            overflow: hidden;
        }

        .etiqueta-50x25 .detalhe-produto {
            font-size: 6pt;
            line-height: 1.05;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
        }

        .etiqueta-50x25 .codigo-container {
            margin-top: auto;
            padding-top: 0.2mm;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border-top: none;
            width: 100%;
            min-height: 0;
        }

        .etiqueta-50x25 .codigo-produto {
            font-size: 8pt;
            line-height: 1;
            font-weight: bold;
            background-color: transparent !important;
            color: black !important;
            padding: 0;
            margin: 0 0 0.25mm 0;
            width: 100%;
            text-align: left;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .etiqueta-50x25 .locacao-produto {
            font-size: 5.5pt;
            line-height: 1;
            font-weight: bold;
            width: 100%;
            text-align: left;
            white-space: nowrap;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .etiqueta-50x25 .local-produto {
            font-size: 5pt;
            line-height: 1;
            width: 100%;
            text-align: left;
        }


        /* ESTILOS DE IMPRESSÃO */
        @media print {
            body { background-color: white; padding: 0; margin: 0; }
            .controls { display: none !important; }

            .etiqueta-50x100, .etiqueta-50x25-container {
                margin: 0;
                border: none;
                page-break-after: always;
            }
            .etiqueta-50x100:last-child, .etiqueta-50x25-container:last-child {
                page-break-after: avoid;
            }

            .codigo-produto {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }

        /* O @page é complexo de dinamizar com JS, então definimos ambos e a classe do body controla qual layout é usado */
        @media screen {
            body.format-50x100 .etiqueta-50x25-container { display: none; }
            body.format-50x25 .etiqueta-50x100 { display: none; }
        }

        @page {
            size: 100mm 50mm;
            margin: 0;
        }
    </style>
    <link rel="stylesheet" href="css/responsive-surgical.css" media="screen">
    <style>
        @media print {
            html,
            body.format-50x25 {
                width: 106mm !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }

            body.format-50x25 #etiquetas-container {
                width: 106mm !important;
                margin: 0 !important;
                padding: 0 !important;
                display: block !important;
                overflow: visible !important;
            }

            body.format-50x25 .etiqueta-50x25-container {
                position: relative !important;
                display: block !important;
                width: 106mm !important;
                min-width: 106mm !important;
                max-width: 106mm !important;
                height: 25mm !important;
                min-height: 25mm !important;
                max-height: 25mm !important;
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
                break-inside: avoid-page !important;
                page-break-inside: avoid !important;
                break-after: page !important;
                page-break-after: always !important;
                contain: layout paint;
            }

            body.format-50x25 .etiqueta-50x25-container:last-child {
                break-after: auto !important;
                page-break-after: auto !important;
            }

            body.format-50x25 .etiqueta-50x25 {
                position: absolute !important;
                top: 0 !important;
                height: 25mm !important;
                max-height: 25mm !important;
                overflow: hidden !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            body.format-50x25 .etiqueta-50x25.etiqueta-left { left: 0.5mm !important; }
            body.format-50x25 .etiqueta-50x25.etiqueta-right { left: 55.5mm !important; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="window.print()">Imprimir Etiquetas</button>
        <div class="format-options">
            <button id="btn-50x100" class="active">Tamanho 50x100</button>
            <button id="btn-50x25">Tamanho 50x25</button>
        </div>
    </div>
    <div id="etiquetas-container">
        </div>

    <script type="module" src="js/etiquetas.js?v=20260924-shortqr4"></script>
</body>
</html>
