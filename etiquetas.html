<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas para Impressão</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
/* Em etiquetas.html, dentro de <style> */

/* ESTILOS GERAIS E DE CONTROLE */
body {
    font-family: Arial, sans-serif;
    background-color: #f0f2f5;
    margin: 0;
    padding: 20px;
}
.controls {
    position: fixed; top: 10px; left: 10px; z-index: 100;
    background-color: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.controls button { font-size: 16px; padding: 10px 20px; cursor: pointer; }

/* NOVA ARQUITETURA DA ETIQUETA */
.etiqueta {
    background-color: white;
    width: 100mm;
    height: 50mm;
    padding: 4mm;
    box-sizing: border-box;
    border: 1px dashed #ccc;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.etiqueta-corpo {
    flex: 1; /* Ocupa todo o espaço vertical disponível */
    display: flex;
    gap: 5mm;
    align-items: center;
}

.qr-code-container {
    flex-shrink: 0;
}

.info-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3mm;
    height: 100%;
}

.info-descricao {
    font-size: 20pt;
    font-weight: bold;
    text-transform: uppercase;
    line-height: 1.1;
}

.info-cor {
    font-size: 16pt;
    text-transform: uppercase;
}

.info-codigo {
    background-color: #000;
    color: #fff;
    font-size: 18pt;
    font-weight: bold;
    text-align: center;
    padding: 6px 10px;
    display: inline-block;
    align-self: flex-start; /* Alinha o bloco à esquerda */
}

.etiqueta-rodape {
    background-color: #000;
    color: #fff;
    font-size: 16pt;
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
    padding: 8px 0;
    margin: 0 -4mm -4mm -4mm; /* Estica para preencher o padding do pai */
    margin-top: 4mm; /* Adiciona espaço antes do rodapé */
}


/* ESTILOS DE IMPRESSÃO */
@media print {
    body { background-color: white; padding: 0; margin: 0; }
    .controls { display: none !important; }
    .etiqueta {
        margin: 0;
        border: none;
        page-break-after: always;
    }
    .etiqueta:last-child { page-break-after: avoid; }

    /* Força fundos e cores a serem impressos */
    .info-codigo, .etiqueta-rodape {
        background-color: #000 !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}
@page { size: 100mm 50mm; margin: 0; }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="window.print()">Imprimir Etiquetas</button>
    </div>
    <div id="etiquetas-container">
        </div>

    <script type="module" src="js/etiquetas.js"></script>
</body>
</html>
