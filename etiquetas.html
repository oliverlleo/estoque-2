<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas para Impressão</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        /* ESTILOS GERAIS E DE CONTROLE */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .controls {
            position: fixed; top: 10px; left: 10px; z-index: 100;
            background-color: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .controls button { font-size: 16px; padding: 10px 20px; cursor: pointer; }

        /* ESTRUTURA RÍGIDA DA ETIQUETA */
        .etiqueta {
            background-color: white;
            width: 100mm;
            height: 50mm;
            padding: 4mm;
            box-sizing: border-box;
            border: 1px dashed #ccc;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Garante que nada vaze para fora */
        }
        .etiqueta-main {
            display: flex;
            gap: 3mm;
            flex: 1; /* Ocupa todo o espaço vertical disponível */
            min-height: 0; /* Correção para flexbox em alguns navegadores */
            margin-bottom: 2mm; /* Adicione esta linha para criar o espaço */
        }
        .qr-code {
            width: 38mm;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .produto-info {
            flex: 1; /* Ocupa o restante da largura */
            display: flex;
            flex-direction: column;
            min-width: 0; /* Correção para flexbox */
        }

        .produto-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribui o espaço */
            flex-grow: 1;
            padding-left: 3mm;
        }
        .produto-descricao {
            font-size: 12pt; /* Tamanho da fonte ainda mais diminuído */
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.2;
            text-align: left;
            flex-grow: 1; /* Ocupa o máximo de espaço vertical */
        }
        .produto-cor, .produto-fornecedor {
            font-size: 10pt;
            font-weight: bold;
            text-transform: uppercase;
        }
        .produto-codigo {
            background-color: black;
            color: white;
            font-size: 16pt;
            font-weight: bold;
            text-align: center;
            padding: 2mm 0;
            margin-top: 2mm;
            width: 100%; /* Ocupa toda a largura da coluna de informações */
        }

        .etiqueta-footer {
            text-align: center;
            font-weight: bold;
            font-size: 12pt;
            border-top: 3px solid black;
            padding-top: 1.5mm;
            margin-top: auto; /* Empurra para o rodapé */
            flex-shrink: 0;
        }

        /* ESTILOS DE IMPRESSÃO */
        @media print {
            body { background-color: white; padding: 0; margin: 0; }

            /* 1. Força o botão a desaparecer, sem chance de erro */
            .controls {
                display: none !important;
            }

            .etiqueta {
                margin: 0;
                border: none;
                page-break-after: always;
            }
            .etiqueta:last-child {
                page-break-after: avoid;
            }

            /* 2. Força os fundos pretos a serem impressos */
            .info-bloco .header {
                background-color: #333 !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
        @page { size: 100mm 50mm; margin: 0; }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="window.print()">Imprimir Etiquetas</button>
    </div>
    <div id="etiquetas-container">
        </div>

    <script type="module" src="js/etiquetas.js"></script>
</body>
</html>
