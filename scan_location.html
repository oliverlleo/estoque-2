<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Locação</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="loader" class="fixed inset-0 bg-white flex flex-col justify-center items-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-gray-600">Buscando locação...</p>
    </div>

    <div id="error-screen" class="hidden fixed inset-0 bg-white flex flex-col justify-center items-center z-40 p-6 text-center">
        <span class="material-icons text-red-500 text-6xl mb-4">error_outline</span>
        <h2 class="text-xl font-bold mb-2">Locação não encontrada</h2>
        <p class="text-gray-500 mb-6">O código escaneado não corresponde a nenhuma locação registrada.</p>
        <a href="index.html" class="bg-blue-500 text-white px-6 py-2 rounded-lg font-medium">Voltar ao Início</a>
    </div>

    <div id="content" class="hidden pb-20">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-30 cursor-pointer" id="header-location">
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-2">
                         <h1 class="text-3xl font-bold" id="locacao-code">...</h1>
                         <span class="material-icons text-blue-200 text-xl">expand_more</span>
                    </div>
                    <p class="text-blue-100 text-sm mt-1" id="local-name">...</p>
                </div>
            </div>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 gap-4 p-4 -mt-2">
            <div class="bg-white p-3 rounded-lg shadow text-center border-l-4 border-blue-500">
                <span class="block text-gray-500 text-xs uppercase font-bold">Total Itens</span>
                <span class="text-2xl font-bold text-gray-800" id="total-items">0</span>
            </div>
        </div>

        <!-- Filter -->
        <div class="px-4 mb-2">
            <input type="text" id="search-input" placeholder="Buscar produto..." class="w-full p-3 rounded-lg border border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- List -->
        <div id="items-list" class="px-4 space-y-3">
            <!-- Items injected here -->
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="product-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" id="product-modal-backdrop"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="relative inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="product-modal-title">
                                Produto
                            </h3>
                            <div class="mt-4">
                                <div class="w-full h-64 bg-gray-100 rounded-lg flex items-center justify-center mb-4 overflow-hidden border border-gray-200">
                                    <img id="product-modal-image" src="" alt="Imagem do Produto" class="w-full h-full object-contain hidden">
                                    <span id="product-modal-placeholder" class="text-gray-400">Sem imagem</span>
                                </div>
                                <div class="text-sm text-gray-500 text-left p-2 bg-gray-50 rounded" id="product-modal-description">
                                    <!-- Descrição Detalhada -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="product-modal-close" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Fechar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Location Selection Modal -->
    <div id="location-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="location-modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" id="location-modal-backdrop"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="relative inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" id="location-modal-title">
                        Trocar Localização
                    </h3>
                    <div class="mt-2 max-h-96 overflow-y-auto" id="location-list">
                        <!-- Locations injected here -->
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="location-modal-close" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        let currentItems = [];
        let configLocais = {}; // Map localId -> Name
        let availableLocationsMap = new Map(); // Key: "localId_locacao", Value: { localId, locacao, count }
        let currentLocalId = null;
        let currentLocacao = null;

        // Elements
        const headerLocation = document.getElementById('header-location');
        const productModal = document.getElementById('product-modal');
        const productModalBackdrop = document.getElementById('product-modal-backdrop');
        const productModalClose = document.getElementById('product-modal-close');

        const locationModal = document.getElementById('location-modal');
        const locationModalBackdrop = document.getElementById('location-modal-backdrop');
        const locationModalClose = document.getElementById('location-modal-close');
        const locationListContainer = document.getElementById('location-list');


        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const shortId = params.get('q');
            const paramLocalId = params.get('localId');
            const paramLocacao = params.get('locacao');

            try {
                let localId, locacao;

                // 1. Resolve Location (Short ID or Direct Params)
                if (shortId) {
                    const locRef = collection(db, 'locacoes_enderecos');
                    const q = query(locRef, where("short_id", "==", shortId));
                    const querySnapshot = await getDocs(q);
                    if (querySnapshot.empty) {
                        showError('Código de localização inválido.');
                        return;
                    }
                    const locDoc = querySnapshot.docs[0].data();
                    localId = locDoc.localId;
                    locacao = locDoc.locacao;
                } else if (paramLocalId && paramLocacao !== null) {
                    localId = paramLocalId;
                    locacao = paramLocacao;
                } else {
                    showError('Nenhuma localização especificada.');
                    return;
                }

                currentLocalId = localId;
                currentLocacao = locacao;

                // 2. Fetch Locais Metadata
                const locaisSnapshot = await getDocs(collection(db, 'locais'));
                configLocais = {};
                locaisSnapshot.forEach(doc => {
                    configLocais[doc.id] = doc.data().nome;
                });

                let localName = configLocais[localId] || 'Local Desconhecido';
                document.getElementById('locacao-code').textContent = locacao || '(Sem locação)';
                document.getElementById('local-name').textContent = localName;

                // 3. Fetch Products and Build Inventory Map
                const productsSnapshot = await getDocs(query(collection(db, 'produtos'), where("arquivado", "!=", true)));

                const items = [];
                availableLocationsMap.clear();

                productsSnapshot.forEach(doc => {
                    const p = doc.data();
                    const productId = doc.id;

                    if (p.locacoes) {
                        p.locacoes.forEach(loc => {
                            if (loc.estoque > 0) {
                                // Add to items if matches current location
                                if (loc.localId === localId && loc.locacao === locacao) {
                                    items.push({
                                        ...p,
                                        id: productId,
                                        estoqueLocal: loc.estoque
                                    });
                                }

                                // Add to available locations map
                                const key = `${loc.localId}_${loc.locacao}`;
                                if (!availableLocationsMap.has(key)) {
                                    availableLocationsMap.set(key, {
                                        localId: loc.localId,
                                        locacao: loc.locacao,
                                        count: 0
                                    });
                                }
                                availableLocationsMap.get(key).count++;
                            }
                        });
                    }
                });

                currentItems = items;
                renderItems(items);
                document.getElementById('total-items').textContent = items.length;

                // Init Search
                document.getElementById('search-input').addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = items.filter(i =>
                        (i.codigo || '').toLowerCase().includes(term) ||
                        (i.descricao || '').toLowerCase().includes(term)
                    );
                    renderItems(filtered);
                });

                // Init Event Listeners
                headerLocation.addEventListener('click', openLocationModal);

                // Modal Close Listeners
                const closeProductModal = () => productModal.classList.add('hidden');
                productModalClose.addEventListener('click', closeProductModal);
                productModalBackdrop.addEventListener('click', closeProductModal);

                const closeLocationModal = () => locationModal.classList.add('hidden');
                locationModalClose.addEventListener('click', closeLocationModal);
                locationModalBackdrop.addEventListener('click', closeLocationModal);

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (e) {
                console.error(e);
                showError('Erro ao carregar dados: ' + e.message);
            }
        });

        function showError(msg) {
            if(msg) document.querySelector('#error-screen p').textContent = msg;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('error-screen').classList.remove('hidden');
        }

        function renderItems(items) {
            const container = document.getElementById('items-list');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-10">Nenhum item encontrado nesta locação.</div>';
                return;
            }

            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'bg-white rounded-lg shadow p-4 flex flex-col gap-2 border border-gray-100 cursor-pointer hover:shadow-lg transition-shadow';
                el.onclick = () => openProductModal(item);

                // Card Layout
                el.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="bg-gray-200 text-gray-800 text-xs font-bold px-2 py-1 rounded">${item.codigo}</span>
                        <span class="text-xs text-gray-500">${item.un}</span>
                    </div>
                    <h3 class="font-bold text-gray-800 text-lg leading-tight">${item.descricao}</h3>
                    <div class="flex justify-between items-end mt-2">
                        <div>
                            <span class="text-xs text-gray-500 block">Cor</span>
                            <span class="font-medium">${item.cor || '-'}</span>
                        </div>
                        <div class="flex gap-4 text-right">
                             <div>
                                <span class="block text-xs text-gray-500">Estoque Local</span>
                                <span class="text-2xl font-bold text-blue-600">${item.estoqueLocal}</span>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(el);
            });
        }

        function openProductModal(item) {
            document.getElementById('product-modal-title').textContent = `${item.codigo} - ${item.descricao}`;
            const imgEl = document.getElementById('product-modal-image');
            const placeholderEl = document.getElementById('product-modal-placeholder');
            const descEl = document.getElementById('product-modal-description');

            if (item.imagem) {
                imgEl.src = item.imagem;
                imgEl.classList.remove('hidden');
                placeholderEl.classList.add('hidden');
            } else {
                imgEl.src = '';
                imgEl.classList.add('hidden');
                placeholderEl.classList.remove('hidden');
            }

            descEl.innerHTML = item.descricao_detalhada ? item.descricao_detalhada.replace(/\n/g, '<br>') : 'Sem descrição detalhada.';
            productModal.classList.remove('hidden');
        }

        function openLocationModal() {
            locationListContainer.innerHTML = '';

            const otherLocations = Array.from(availableLocationsMap.values())
                .filter(l => !(l.localId === currentLocalId && l.locacao === currentLocacao))
                .sort((a, b) => {
                    const nameA = configLocais[a.localId] || '';
                    const nameB = configLocais[b.localId] || '';
                    return nameA.localeCompare(nameB) || a.locacao.localeCompare(b.locacao);
                });

            if (otherLocations.length === 0) {
                locationListContainer.innerHTML = '<div class="p-4 text-center text-gray-500">Nenhuma outra localização com estoque encontrada.</div>';
            } else {
                otherLocations.forEach(loc => {
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-3 hover:bg-gray-100 border-b border-gray-100 flex justify-between items-center';
                    const localName = configLocais[loc.localId] || 'Local Desconhecido';

                    btn.innerHTML = `
                        <div>
                            <div class="font-bold text-gray-800">${localName}</div>
                            <div class="text-sm text-gray-500">Locação: ${loc.locacao || '(Vazio)'}</div>
                        </div>
                        <span class="bg-blue-100 text-blue-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">${loc.count} itens</span>
                    `;

                    btn.onclick = () => {
                         // Switch location by reloading with new params
                         window.location.search = `?localId=${loc.localId}&locacao=${encodeURIComponent(loc.locacao)}`;
                    };
                    locationListContainer.appendChild(btn);
                });
            }

            locationModal.classList.remove('hidden');
        }
    </script>
</body>
</html>
